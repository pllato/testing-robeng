<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ELC Kids — программа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf7;--card:#fff;--ink:#1a1828;--mute:#6b6985;--line:#ececf2;
    --ac:#7c5cfc;--acbg:rgba(124,92,252,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
  .sub{color:var(--mute);margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;transition:.15s}
  a.card:hover{transform:translateY(-1px);border-color:var(--ac);box-shadow:0 4px 18px rgba(124,92,252,.12)}
  .num{display:inline-block;font-size:11px;font-weight:600;color:var(--ac);background:var(--acbg);padding:3px 8px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
  .topic{font-size:15px;font-weight:600;line-height:1.3;color:var(--ink)}
  .meta{font-size:12px;color:var(--mute);margin-top:6px}
  .loading{color:var(--mute);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>ELC Kids — программа English</h1>
  <p class="sub">70 уроков · нажмите на урок, чтобы открыть материал</p>
  <div id="grid" class="grid"><div class="loading">Загружаем программу…</div></div>
</div>
<script>
const CURRICULUM_URL = "https://pub-4a4bf55405d74fe58e817b5fb86955d4.r2.dev/curriculum.json";

async function main(){
  const grid = document.getElementById("grid");
  try{
    const r = await fetch(CURRICULUM_URL, { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    grid.innerHTML = "";
    for (const L of d.lessons){
      const a = document.createElement("a");
      a.href = `lesson.html?n=${L.lesson}`;
      a.className = "card";
      a.innerHTML = `
        <div class="num">Урок ${L.lesson}</div>
        <div class="topic">${escapeHtml(L.topic || "")}</div>
        <div class="meta">${L.words.length} слов · ${L.grammar_patterns.length} паттернов</div>`;
      grid.appendChild(a);
    }
  }catch(e){
    grid.innerHTML = `<div class="loading">Ошибка загрузки: ${e.message}</div>`;
  }
}
function escapeHtml(s){return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
main();
</script>
</body>
</html>
